services:
  subgen:
    container_name: ${CONTAINER_NAME}-subgen
    image: mccloud/subgen:cpu
    tty: true
    network_mode: bridge
    cpu_shares: 512

    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_THREADS=${WHISPER_THREADS:-4}
      - CONCURRENT_TRANSCRIPTIONS=${CONCURRENT_TRANSCRIPTIONS:-1}
      - PROCADDEDMEDIA=${PROCADDEDMEDIA:-True}
      - PROCMEDIAONPLAY=${PROCMEDIAONPLAY:-False}
      - SKIPIFINTERNALSUBLANG=${SKIPIFINTERNALSUBLANG:-eng}
      - DEBUG=${DEBUG:-False}

      - NAMESUBLANG=aa
      - WEBHOOKPORT=9000
      - WORD_LEVEL_HIGHLIGHT=False
      - USE_PATH_MAPPING=False
      - TRANSCRIBE_DEVICE=cpu
      - CLEAR_VRAM_ON_COMPLETE=True
      - MODEL_PATH=./models
      - UPDATE=False
      - APPEND=False
      - USE_MODEL_PROMPT=False
      - CUSTOM_MODEL_PROMPT=
      - LRC_FOR_AUDIO_FILES=True

    volumes:
      - ${MEDIA_PATH}/tv:/tv
      - ${MEDIA_PATH}/movies:/movies
      - ${CONFIG_PATH}/${CONTAINER_NAME}-subgen/models:/subgen/models

    ports:
      - "9999:9000"

    restart: unless-stopped


  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: ${CONTAINER_NAME}-bazarr
    network_mode: bridge
    cpu_shares: 512

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago

    volumes:
      - ${CONFIG_PATH}/${CONTAINER_NAME}-bazarr:/config
      - ${MEDIA_PATH}/movies:/movies:rw
      - ${MEDIA_PATH}/tv:/tv:rw

    ports:
      - "6767:6767"

    restart: unless-stopped
